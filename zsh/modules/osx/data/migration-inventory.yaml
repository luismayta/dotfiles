source_sync_order_notes:
- 'Spellings are exact: appStore (capital S), automaticUpdates (camelCase), missioncontrol (all lowercase).'
- osx::sync calls osx::keyboard, which calls osx::vim::keyboard - so the ApplePressAndHoldEnabled write/delete
  block runs inside position 3. The structured record for this transitive call (caller, callee, source_line,
  counts) lives in source_sync_order_transitive; this prose is commentary only and the data key is the authority.
- osx::mail and osx::spotlight are defined late in the file but invoked early (positions 8 and 9); definition
  order is not invocation order.
- 'Order decides the 7 conflicting duplicates: e.g. dock (7) runs after screen (5), so askForPasswordDelay
  ends at 5; missioncontrol (11) runs after dock (7), so the hot corners end at the missioncontrol values.'
