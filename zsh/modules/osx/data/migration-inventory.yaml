notes:
- 'CRITICAL - the hostname block is destructive when unassigned: COMPUTER_NAME is referenced 4 times and
  assigned 0 times, so `scutil --set ComputerName ""` erases the configured network name. Any re-expression
  must take the machine name as an explicit required input, never as an empty string.'
- 'ApplePressAndHoldEnabled is written 13 times (106-132) but the delete at 134 is -g (NSGlobalDomain),
  so it undoes ONLY the 2 NSGlobalDomain writes at 106 and 108. The other 11 writes (110-132) go to app
  domains (VSCode, JetBrains, iTerm2, Insomnia, Brave, Android Studio) and persist as -bool false. Net
  effect: NSGlobalDomain is unset, while the 11 app-domain writes persist.'
- 'Same-domain, same-key, different-case domains are NOT merged: com.apple.Finder (222) is treated as
  distinct from com.apple.finder. That is why it shows up as a dead key rather than as a duplicate.'
- SOInputLineSettings (457, 463, 464, 465) is 4 `-dict-add` writes of the same value (-bool false) into
  the same dict key with different sub-keys, so it is redundant rather than conflicting. This is the one
  case where value comparison must ignore the sub-key.
- Multi-line values (toolbar config at 252, FXInfoPanesExpanded at 297, spotlight orderedItems at 532)
  are single write calls spanning several physical lines; the anchor is the call's first line.
- 'The dead-key and conflicting-duplicate sections overlap by design: a dead key is still a key darwin-system-config
  must decide about - drop it, or re-express it correctly.'
- 'Out of scope by instruction: the design.md finding that message_error returns 0.'
