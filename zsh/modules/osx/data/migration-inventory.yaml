  dead_since: pre-Mavericks legacy domain
  correct_domain: com.apple.finder
  detail: 'Capital F is a different domain from com.apple.finder and is not read on modern macOS. Note
    the intent is left unfulfilled: the source never writes AppleShowAllFiles to the lowercase domain,
    so hidden files are not actually shown.'
