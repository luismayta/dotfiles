## CROSS-SHELL PROMPT
##
## Hadenlabs starship configuration
#prompt global settings
########################################

## Core Settings
## -------------

"$schema" = 'https://starship.rs/config-schema.json'

palette = "tokyonight"

# Custom format with explicit section ordering
format = """\
$username\
$directory\
$git_branch\
$git_state\
$git_status\
$custom\
$kubernetes\
$aws\
$container\
$nix_shell\
$all\
"""

right_format = """\
$cmd_duration \
$status \
$jobs \
$memory_usage \
"""

# Inserts a blank line between shell prompts
add_newline = false

# Wait 10 milliseconds for starship to check files under the current directory.
scan_timeout = 10

[palettes.tokyonight]
# Colors from TokyoNight Storm palette
color_red = "#f7768e"
color_green = "#9ece6a"
color_blue = "#7aa2f7"
color_cyan = "#7dcfff"
color_magenta = "#bb9af7"
color_orange = "#ff9e64"
color_yellow = "#e0af68"
color_surface0 = "#414868"
color_surface1 = "#494d64"
color_surface2 = "#565f89"
color_overlay0 = "#565f89"
color_text = "#c0caf5"
color_lavender = "#b4f9f8"
color_subtext0 = "#a9b1d6"
color_lilac = "#c0caf5"
color_crust = "#1a1b26"

## Shell & User
## -------------

# Shell indicator for each shell type
[shell]
fish_indicator = "🐟"
zsh_indicator = "🐺"
bash_indicator = "🐚"
powershell_indicator = "_"
disabled = false

[username]
format = "[$user]($style) in "
disabled = false
show_always = true
style_user = "bold $blue"
style_root = "bold $red"

# Prompt character and color
[character]
format = "$symbol "
success_symbol = "[->](bold $green)" # The "success_symbol" segment is being set to "➜" with the color "bold green"
error_symbol = "[🤮 ](bold $red)"     # The "success_symbol" segment is being set to "➜" with the color "bold green"

## Directory
## ----------

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
home_symbol = "🏠"
read_only = "🔒"
read_only_style = "$red"
style = "bold $teal"
truncation_length = 2
truncate_to_repo = true
truncation_symbol = ".../"
repo_root_style = "$mauve"
fish_style_pwd_dir_length = 1
use_logical_path = true

[directory.substitutions]
"~/Projects/" = "🐺"

## Git
## ---

[git_branch]
symbol = "🌱 "
truncation_symbol = ""

[git_status]
conflicted = "⚔️ "
ahead = "🏎💨"
behind = "😰"
diverged = "😵"
untracked = "🤷"
stashed = "📦"
modified = "📝"
staged = '[++\($count\)]($green)'
renamed = "👅"
deleted = "🗑"

[git_commit]
disabled = false
commit_hash_length = 8
tag_symbol = "🔖 "
format = "[\\($hash\\)]($style) "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold $red)"

# Display symbol for remote Git server (GitHub/GitLab/Bitbucket/etc.)
[custom.giturl]
disabled = false
description = "Display symbol for remote Git server"
command = """
REMOTE=$(git remote get-url origin 2> /dev/null)
if [[ "$REMOTE" =~ "github" ]]; then
    SYMBOL="🐙 "
elif [[ "$REMOTE" =~ "gitlab" ]]; then
    SYMBOL="🦊 "
elif [[ "$REMOTE" =~ "bitbucket" ]]; then
    SYMBOL="💧 "
elif [[ "$REMOTE" =~ "git" ]]; then
    SYMBOL="🔀 "
else
    SYMBOL="🔗 "
fi
echo "$SYMBOL "
"""
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
shell = ["bash", "--noprofile", "--norc"]
format = "$output "

# custom.githash removed — redundant with [git_commit] built-in module

## Cloud & Infrastructure
## ---------------------

[kubernetes]
disabled = false
symbol = "⛵ "
format = '[$symbol$context( \($namespace\))]($style) '

[[kubernetes.contexts]]
context_pattern = "docker-desktop"
context_alias = "🐳"

[[kubernetes.contexts]]
context_pattern = ".*/openshift-cluster/.*"
context_alias = "openshift"

[[kubernetes.contexts]]
context_pattern = ".*/(?P<cluster>[\\w-]+)/.*"
context_alias = "$cluster"

[[kubernetes.contexts]]
context_pattern = "k8s:(?P<cluster_name>.*)"
context_alias = "k8s: $cluster_name"

[[kubernetes.contexts]]
context_pattern = ".*@talos-(?P<cluster_name>.*)"
context_alias = "talos: $cluster_name"

[[kubernetes.contexts]]
context_pattern = "infosis:k8s:(?P<cluster_name>.*)"
context_alias = "infosis: $cluster_name"

[[kubernetes.contexts]]
context_pattern = "arn:aws:.*:cluster/(?P<cluster_name>.*)"
context_alias = "AWS: $cluster_name"

[[kubernetes.contexts]]
context_pattern = "eks:cluster:(?P<cluster_name>.*)"
context_alias = "eks: $cluster_name"

[aws]
format = "on [$symbol $region $profile]($style) "
style = "bold $blue"
symbol = "⛅"

[aws.region_aliases]
ap-southeast-2 = "au"
us-east-1 = "va"

[docker_context]
disabled = true

## Languages & Runtimes
## --------------------

[golang]
style = "bold $teal"
symbol = "🐹 "
format = "via [$symbol$version]($style) "

[python]
detect_extensions = []

[lua]
format = 'via [🌕 $version](bold $blue) '

[dart]
format = 'via [🔰 $version](bold $red) '

[deno]
format = 'via [🦕 $version]($green bold) '

[helm]
style = "bold fg:$teal bg:$surface0"
format = "[  ](fg:$white bg:$surface0)[$symbol$version]($style)"

## Tools
## -----

[terraform]
disabled = false
detect_extensions = ["tf", "tfplan", "tfstate", "hcl"]
format = " [$symbol$workspace]($style)"

[package]
disabled = false
format = "[$symbol$version]($style) "

## System
## ------

## Memory
[memory_usage]
disabled = false
style = "bold dimmed $green"
threshold = 75
format = '\[$symbol[$ram( | $swap)]($style)\]'

[cmd_duration]
min_time = 1_000

# doc: https://starship.rs/config/#jobs
[jobs]
symbol = "🏃️"
threshold = 4
format = "[$symbol_threshold $number_threshold]($style) "

[sudo]
disabled = false

# Exit code of previous command
[status]
disabled = false
symbol = "💀 "
success_symbol = ""
format = "[$symbol$status]($style) "
map_symbol = true
recognize_signal_code = true
pipestatus = true
pipestatus_separator = "|"

# Container environment detection
[container]
disabled = false
symbol = "📦 "
format = "[$symbol$name]($style) "
style = "bold $blue"

# Node.js runtime
[nodejs]
format = "via [⬢ $version](bold green) "
style = "bold green"

# Rust runtime
[rust]
format = "via [🦀 $version]($style) "
style = "bold $red"

# Nix shell environment
[nix_shell]
disabled = false
impure_msg = "impure"
pure_msg = "pure"
unknown_msg = ""
format = 'via [❄️ $state( \($name\))](bold $blue) '

## Environment
## -----------

[env_var.AWS_PROFILE_NAME]
symbol = "⛅"
variable = "AWS_PROFILE_NAME"
default = "profile name"
style = "bold $blue"

[env_var.TMUX]
default = 'tmux'
style = 'bold $green'
format = '[🥷 ]($style)'