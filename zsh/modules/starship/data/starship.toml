## CROSS-SHELL PROMPT
##
## Hadenlabs starship configuration
#prompt global settings
########################################

## Core Settings
## -------------

"$schema" = 'https://starship.rs/config-schema.json'

palette = "tokyonight"

format = "$all"

# Inserts a blank line between shell prompts
add_newline = false

# Wait 10 milliseconds for starship to check files under the current directory.
scan_timeout = 10

[palettes.tokyonight]
# Colors from TokyoNight Storm palette
color_red = "#f7768e"
color_green = "#9ece6a"
color_blue = "#7aa2f7"
color_cyan = "#7dcfff"
color_magenta = "#bb9af7"
color_orange = "#ff9e64"
color_yellow = "#e0af68"
color_surface0 = "#414868"
color_surface1 = "#494d64"
color_surface2 = "#565f89"
color_overlay0 = "#565f89"
color_text = "#c0caf5"
color_lavender = "#b4f9f8"
color_subtext0 = "#a9b1d6"
color_lilac = "#c0caf5"
color_crust = "#1a1b26"

## Shell & User
## -------------

# Shell indicator for each shell type
[shell]
fish_indicator = "🐟"
zsh_indicator = "🐺"
bash_indicator = "🐚"
powershell_indicator = "_"
disabled = false

[username]
format = "[$user]($style) in "
disabled = false
show_always = true
style_user = "bold $blue"
style_root = "bold $red"

# Prompt character and color
[character]
format = "$symbol "
success_symbol = "[->](bold $green)" # The "success_symbol" segment is being set to "➜" with the color "bold green"
error_symbol = "[🤮 ](bold $red)"     # The "success_symbol" segment is being set to "➜" with the color "bold green"

## Directory
## ----------

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
home_symbol = "🏠"
read_only = "🔒"
read_only_style = "$red"
style = "bold $teal"
truncation_length = 2
truncate_to_repo = true
truncation_symbol = ".../"
repo_root_style = "$mauve"
fish_style_pwd_dir_length = 1
use_logical_path = true

[directory.substitutions]
"/Volumes/Data/projects" = "🐺"

## Git
## ---

[git_branch]
symbol = "🌱 "
truncation_symbol = ""

[git_status]
conflicted = "⚔️ "
ahead = "🏎💨"
behind = "😰"
diverged = "😵"
untracked = "🤷"
stashed = "📦"
modified = "📝"
staged = '[++\($count\)]($green)'
renamed = "👅"
deleted = "🗑"

[git_commit]
commit_hash_length = 4
tag_symbol = "🔖 "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold $red)"

# Display symbol for remote Git server (GitHub/GitLab/Bitbucket/etc.)
[custom.giturl]
disabled = false
description = "Display symbol for remote Git server"
command = """
REMOTE=$(command git ls-remote --get-url 2> /dev/null)
if [[ "$REMOTE" =~ "github" ]]; then
    SYMBOL=""
elif [[ "$REMOTE" =~ "gitlab" ]]; then
    SYMBOL=""
elif [[ "$REMOTE" =~ "bitbucket" ]]; then
    SYMBOL=""
elif [[ "$REMOTE" =~ "git" ]]; then
    SYMBOL=""
else
    SYMBOL=""
fi
echo "$SYMBOL "
"""
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
shell = ["bash", "--noprofile", "--norc"]
format = "$output "

[custom.githash]
disabled = false
description = "Display git hash"
command = "git rev-parse --short HEAD"
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
shell = ["bash", "--noprofile", "--norc"]
format = "$output "

## Cloud & Infrastructure
## ---------------------

[kubernetes]
disabled = false
symbol = "⛵ "
format = '[$symbol$context( \($namespace\))]($style) '

[kubernetes.context_aliases]
docker-desktop = "🐳"
# OpenShift contexts carry the namespace and user in the kube context: `namespace/name/user`:
".*/openshift-cluster/.*" = "openshift"

# Or better, to rename every OpenShift cluster at once:
".*/(?P<cluster>[\\w-]+)/.*" = "$cluster"

"k8s:(?P<cluster_name>.*)" = "k8s: $cluster_name"

# talos
".*@talos-(?P<cluster_name>.*)" = "talos: $cluster_name"

# infosis

"infosis:k8s:(?P<cluster_name>.*)" = "infosis: $cluster_name"

# aws

"arn:aws:.*:cluster/(?P<cluster_name>.*)" = "AWS: $cluster_name"

"eks:cluster:(?P<cluster_name>.*)" = "eks: $cluster_name"

[aws]
format = "on [$symbol $region $profile]($style) "
style = "bold $blue"
symbol = "⛅"

[aws.region_aliases]
ap-southeast-2 = "au"
us-east-1 = "va"

[docker_context]
disabled = true

## Languages & Runtimes
## --------------------

[golang]
style = "bold $teal"
symbol = "[]($teal)"
format = "[$symbol $version]($style) "

[python]
pyenv_version_name = true
detect_extensions = []

[lua]
format = 'via [🌕 $version](bold $blue) '

[dart]
format = 'via [🔰 $version](bold $red) '

[deno]
format = 'via [🦕 $version]($green bold) '

[helm]
style = "bold fg:$teal bg:$surface0"
format = "[  ](fg:$white bg:$surface0)[$symbol$version]($style)"

## Tools
## -----

[terraform]
disabled = false
detect_extensions = ["tf", "tfplan", "tfstate", "hcl"]
format = " [$symbol$workspace]($style)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = false

## System
## ------

## Memory
[memory_usage]
disabled = false
style = "bold dimmed $green"
threshold = -1
format = '\[$symbol[$ram( | $swap)]($style)\]'

[cmd_duration]
min_time = 1_000

# doc: https://starship.rs/config/#jobs
[jobs]
symbol = "🏃️"
threshold = 4
format = "[$symbol_threshold $number_threshold]($style) "

[sudo]
disabled = false

## Environment
## -----------

[env_var.AWS_PROFILE_NAME]
symbol = "⛅"
variable = "AWS_PROFILE_NAME"
default = "profile name"
style = "bold $blue"

[env_var.TMUX]
default = 'tmux'
style = 'bold $green'
format = '[🥷 ]($style)'

[env_var.VISUAL]
format = ""
default = "nvim"

[env_var.EDITOR]
format = ""
default = "nvim"

## Custom Indicators
## -----------------

[custom.proxy_is_on]
command = ""
when = "proxy is-on"
symbol = "歷"
description = "Shows if proxy settings are on"
format = "[$symbol]($style)"
style = "fg:$green"

[custom.proxy_is_off]
command = ""
when = "proxy is-off"
symbol = "轢"
description = "Shows if proxy settings are off"
format = "[$symbol]($style)"
style = "fg:$red"
