---
name: helix
tags:
  - helix
  - zsh
license: "LGPL-3.0"
github_repo: luismayta/dotfiles
description: |-
  Helix ZSH module providing Helix editor integration and configuration
features:
  - "Helix installation via package manager"
  - "Configuration synchronization"
  - "Runtime grammar management"
requirements: |-
  - zsh (loaded as part of dotfiles zsh modules)
variable_assignment_pattern: |-
  - Use `:=` in base.zsh for default values (user-overridable)
  - Use direct assignment `VAR="value"` in osx.zsh/linux.zsh for platform-specific overrides
  - Use `:=` inside if blocks for Homebrew path detection
