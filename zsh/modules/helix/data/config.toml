# Helix editor configuration

theme = "tokyonight_storm"

[editor]
line-number = "relative"
cursorline = true
true-color = true
scrolloff = 8
completion-trigger-len = 1
auto-completion = true
idle-timeout = 500
auto-format = true
bufferline = "multiple"
cursor-shape = { insert = "bar", normal = "block", select = "underline" }
file-picker = { hidden = false }

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator"]
center = ["diagnostics"]
right = ["selections", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.whitespace.render]
space = "none"
tab = "all"
nbsp = "all"
newline = "none"

[editor.indent-guides]
render = true
character = "│"
skip-levels = 1

[keys.normal]
# Window navigation
"C-h" = "jump_view_left"
"C-j" = "jump_view_down"
"C-k" = "jump_view_up"
"C-l" = "jump_view_right"

# Quick save
"C-s" = ":write"

# Line operations (macros: @ = macro prefix)
"A-d" = "@xd"         # Alt-d: select line then delete (like vim dd)
"A-y" = "@xy"         # Alt-y: select line then yank (like vim yy)
"p" = "paste_after"   # Paste after cursor
"P" = "paste_before"  # Paste before cursor

[keys.insert]
"C-s" = ":write"
# Vim-style exit insert mode
"j" = { "j" = "normal_mode", "k" = "normal_mode" }  # jj or jk to exit

[keys.select]
"C-h" = "jump_view_left"
"C-j" = "jump_view_down"
"C-k" = "jump_view_up"
"C-l" = "jump_view_right"

# Leader key ',' for quick commands
[keys.normal.","]  # This creates a minor mode on ','
"w" = ":write"           # ,w to save
"q" = ":quit"            # ,q to quit
"e" = "file_picker"      # ,e to open file picker
"f" = "global_search"    # ,f to find in files
