# MPD configuration — user-level service (managed by zsh module)
# MPD runs with --systemd flag via systemd --user

# Music directory
music_directory "/home/lucho/Music"

# Database and state files (user-writable location)
db_file "/home/lucho/.config/mpd/mpd.db"
state_file "/home/lucho/.config/mpd/mpdstate"
sticker_file "/home/lucho/.config/mpd/sticker.sql"

# Playlists directory
playlist_directory "/home/lucho/.config/mpd/playlists"

# Audio output — ALSA (default)
audio_output {
  type "alsa"
  name "ALSA"
}

# FIFO for ncmpcpp visualizer
audio_output {
  type "fifo"
  name "FIFO"
  path "/tmp/mpd.fifo"
  format "44100:16:2"
}
