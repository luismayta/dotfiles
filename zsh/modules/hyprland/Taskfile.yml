---
version: "3"

tasks:
  readme:
    desc: Generate module README.md
    silent: true
    cmds:
      - >-
        gomplate --file {{.README_MODULE_TEMPLATE}}
        --out zsh/modules/hyprland/README.md
        --datasource config=zsh/modules/hyprland/README.yaml
        --datasource includes={{.README_INCLUDES}}

  lint:
    run: once
    dir: "{{.TASKFILE_DIR}}"
    desc: "Check Lua syntax with luac -p"
    cmds:
      - find data -name '*.lua' -exec luac -p {} +
    silent: true
