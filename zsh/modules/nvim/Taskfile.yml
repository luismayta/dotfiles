---
version: "3"

tasks:
  readme:
    desc: Generate module README.md
    silent: true
    cmds:
      - >-
        gomplate --file {{.README_MODULE_TEMPLATE}}
        --out zsh/modules/nvim/README.md
        --datasource config=zsh/modules/nvim/README.yaml
        --datasource includes={{.README_INCLUDES}}

  lint:
    run: once
    dir: "{{.TASKFILE_DIR}}"
    desc: "Check Lua syntax with luac -p"
    cmds:
      - find data -name '*.lua' -exec luac -p {} +
    silent: true

  # build: removed — LazyVim discovers plugins statically via lazy.nvim import

  backup:
    run: once
    dir: "{{.TASKFILE_DIR}}"
    desc: "Backup ~/.config/nvim/ to data/ (dry-run by default)"
    cmds:
      - cmd: "nvim::backup"
        silent: true
      - cmd: "nvim::backup --apply"
        silent: false
        ignore_error: true
    silent: true
