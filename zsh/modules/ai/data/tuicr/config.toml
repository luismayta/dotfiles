# tuicr configuration for CodipLabs AI workflow
# https://github.com/agavra/tuicr

theme = "tokyo-night-storm"

# Vim-style leader key (default ";")
leader = ","

editor = "nvim"               # editor for `e` / `:edit`; overrides $EDITOR

# Vim modal editing in comment box
comment_vim = true

# Vim-like scrolloff
scroll_offset = 5

# Display defaults
diff_view = "side-by-side"
show_file_list = true
show_commits = true
show_reviewed = true
cursor_line = true
search_highlight = true
mouse = true
wrap = true

[[comment_types]]
id = "issue"
color = "red"
definition = "must fix before merge"
