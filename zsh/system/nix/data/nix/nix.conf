# Nix configuration reference
#
# On nix-darwin systems, these settings are applied via `nix.settings`
# in nix/darwin/default.nix. This file serves as reference and for
# manual installations on Linux.
#
# Copy to /etc/nix/nix.conf on Linux systems that don't use nix-darwin.

experimental-features = nix-command flakes
build-users-group = nixbld
max-jobs = auto
