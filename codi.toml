[scm]
provider = "github"
flow = "github-flow"

# Examples (derive issue id from branch name)
#
# Jira:
# - Branch: feature/<PROJECTKEY>-123
# - Commit: ✨ feat(core): <PROJECTKEY>-123 add mcp docs
#
# GitHub:
# - Branch: feature/123-add-mcp-docs
# - Commit: fix 🐛 (core): handle missing env var (#123)
# - Optional body: Fixes #123
#
# GitLab:
# - Branch: feature/123-add-mcp-docs
# - Commit: chore 🧹 (core): bump tooling (#123)
# - Optional body: Closes #123

[issueTracking]
provider = "jira"
projectKey = "PE"

# Optional. If omitted, agents should derive as: ^<projectKey>-[0-9]+$
# keyRegexOverride = "^AR-[0-9]+$"

[issueTracking.branch]
# Source for deriving the issue id/key. Agents should use the current git branch name.
# Example command: git rev-parse --abbrev-ref HEAD
source = "branch"

# Jira: extract the first Jira key found in the branch name.
# This must be derived dynamically from `[issueTracking].projectKey`.
# If you need a custom pattern, set `jiraKeyRegexOverride`.
jiraKeyFromProjectKey = true
jiraKeyRegexOverride = ""

# GitHub/GitLab: extract the first issue number found in the branch name.
# Recommended branch patterns:
# - feature/123-short-desc
# - bugfix/123-short-desc
githubIssueNumberRegex = "(?:^|/)([0-9]+)(?:-|$)"
gitlabIssueNumberRegex = "(?:^|/)([0-9]+)(?:-|$)"

[commit]
tool = "goji"
format = "<type> <emoji> (<scope>): <issueKey> <subject>"
style = "jira"
signoff = true
# Skip git hooks (pre-commit, commit-msg) via --no-verify
noVerify = true
# Maximum total header length: <type> <emoji> (<scope>): <issueKey> <subject>
# LLM agents must calculate available subject length as:
#   available = subjectMaxLength - len(<type> <emoji> (<scope>): <issueKey> )
# Example: "chore 🧹 (skills): PE-100 " = 25 chars → subject max = 80 - 25 = 55 chars
subjectMaxLength = 100
defaultScope = "other"

[commit.providers.github]
format = "<type> <emoji> (<scope>): <subject> (#<issueKey>)"
issueRegex = "\\(#[0-9]+\\)$"
closingBodyLine = "Fixes #<number>"

[commit.providers.gitlab]
format = "<type> <emoji> (<scope>): <subject> (#<issueKey>)"
issueRegex = "\\(#[0-9]+\\)$"
closingBodyLine = "Closes #<number>"

[commit.providers.jira]
format = "<type> <emoji> (<scope>): <issueKey> <subject>"
# Optional. If omitted, agents should derive as: ^<projectKey>-[0-9]+$
# keyRegexOverride = "^AR-[0-9]+$"

# OKF document defaults (PE-520). Required: OKF commands fail without
# an [okf] section containing [okf.default].
[okf.default]
status = "draft"
type = ""
company = "codip"
project = "codip-ai"
version = "2.0.0"
author = "CodipLabs"
# OKF exclude paths (documentation example only — fully commented out).
# Excludes applied by `okf sync`, `okf validate`, and `okf context` on top of .gitignore.
# `paths` = gitignore-style glob patterns (negation `!` supported; leading `/` anchors to repo root).
# `files` = exact repo-relative file paths (literal equality, NOT globs).
[okf.exclude_paths]
paths = [
    "docs/prompts/**",
    "vendor/**",
    "openspec/**",
    ".codi/**",
    "skills/**",
    ".opencode/**",
    ".changeset/**",
    ".chglog/**",
    ".github/**",
]
files = [
    "AGENTS.md",
    "CHANGELOG.md",
]