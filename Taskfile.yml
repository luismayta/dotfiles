env:
  DOCKER:
    sh: docker --version 2> /dev/null || echo "not exist"
  PYTHON:
    sh: python --version 2> /dev/null || echo "not exist"
  GO:
    sh: go version 2> /dev/null || echo "not exist"
  NODE:
    sh: node --version 2> /dev/null || echo "not exist"
  APP_TAG:
    sh: git describe --tags $(git rev-list --tags --max-count=1) 2> /dev/null || echo "0.0.0"
  README_YAML: provision/generators/README.yaml
  README_TEMPLATE: provision/templates/README.tpl.md
  README_MODULE_TEMPLATE: provision/templates/README.module.tpl.md
  README_INCLUDES:
    sh: echo "file://$(pwd)/"
  TERRAFORM_PATH: ./
  PYTHON_PACKAGE_MANAGER: uv

dotenv:
  - .env

vars:
  PROJECT_NAME: dotfiles
  ORGANIZATION: luismayta
  DOCKER_PLATFORM: linux/amd64
  REVIEWERS: luismayta
  PYTHON_VERSION: 3.11.5
  NODE_VERSION: v24.18.1
  GRADLE_VERSION: 8.4.0
  GOLANG_VERSION: 1.25
  GIT_IGNORES: python,node,go,zsh,sonar,java,maven,intellij+all,terraform,linux
  COMMIT: $(git rev-parse HEAD)
  RELEASE_DIR: ./release
  DATE: $(date +%s)
  GOLANGCI_VERSION: 1.42.0
  TERRAFORM_VERSION: 1.15.8
  README_FILE: README.md
  # NOTE: Agent workflow conventions live in `codi.toml`.
  GIT_IGNORES_CUSTOM: |
    bin
    .project
    .scannerwork
    .secrets
    public
    TMP_CHANGELOG.md
    .task
    .terraform.lock.hcl
    build
    .task
    .terraform.lock.hcl
    *.lock
    *.lock.hcl
    .cq/
    *.zip
    package-lock.json
    provision/ansible/*/roles/contrib
    .external_modules
    vendor
    charts
    .DS_Store
    .turbo
    .infobot
    .jira-config.json
    *.pkg.tar.zst
    *.db

    graphify-out/*

    .codi/build

    !flake.lock
    .direnv/*

    .lycheecache
    !zsh/modules/git/bin
    !zsh/modules/herdr/bin

  AI_IGNORE_CUSTOM: |
    # Block specific paths
    /secrets/**
    /private/**
    !/private/public-config.json

    # Block directories anywhere
    **/node_modules/**
    **/dist/**
    **/build/**
    **/.cache/**
    build

tasks:
  default:
    deps:
      - task: check
    cmds:
      - cmd: echo Application {{.PROJECT_NAME}}
        silent: true
      - task: version:default
      - task: summary
      - cmd: task -l
    silent: true

  summary:
    desc: "Summary information"
    cmds:
      - echo Go available {{.GO}}
      - echo Python available {{.PYTHON}}
      - echo Docker available {{.DOCKER}}
      - echo Node available {{.NODE}}
    silent: true

  check:
    desc: "Check all dependencies"
    deps:
      - uv:check
      - node:check
      - changelog:check
      - git:check
      - docs:check
      - go:check
      - ai:check
      - bun:check
      - skills:check

  readme:
    desc: Generate all READMEs (root + all modules)
    silent: true
    deps:
      - task: readme:modules
    cmds:
      - >-
        gomplate --file {{.README_TEMPLATE}}
        --out {{.README_FILE}}
        --datasource config={{.README_YAML}}
        --datasource includes={{.README_INCLUDES}}
      - task: format

  readme:modules:
    desc: Generate all module READMEs
    silent: true
    deps:
      - task: module-ai:readme
      - task: module-alacritty:readme
      - task: module-aliases:readme
      - task: module-apps:readme
      - task: module-bitwarden:readme
      - task: module-clean:readme
      - task: module-devbox:readme
      - task: module-devops:readme
      - task: module-docker:readme
      - task: module-ghostty:readme
      - task: module-ghq:readme
      - task: module-git:readme
      - task: module-github:readme
      - task: module-goenv:readme
      - task: module-hammerspoon:readme
      - task: module-herdr:readme
      - task: module-hyprland:readme
      - task: module-issues:readme
      - task: module-keybase:readme
      - task: module-mobile:readme
      - task: module-mpd:readme
      - task: module-nix:readme
      - task: module-nix-darwin:readme
      - task: module-nodejs:readme
      - task: module-notify:readme
      - task: module-nvim:readme
      - task: module-pazi:readme
      - task: module-python:readme
      - task: module-resources:readme
      - task: module-rust:readme
      - task: module-rvm:readme
      - task: module-ssh:readme
      - task: module-starship:readme
      - task: module-templates:readme
      - task: module-tmux:readme
      - task: module-waybar:readme
      - task: module-wezterm:readme
      - task: module-yazi:readme
      - task: module-zed:readme

  format:
    desc: Execute format files
    cmds:
      - task: biome:fmt
      - task: uv:fmt
      - cmd: stylua --allow-hidden .

  upgrade:
    desc: Execute upgrade packages
    cmds:
      - uv update
      - task: pre-commit:update

  setup:
    desc: Setup dependences of project
    cmds:
      - >-
        [ -e ".env" ] || cp -rf .env.example .env
      - task: uv:setup
      - task: git:setup
      - task: ai:setup
      - task: skills:setup

  environment:
    desc: Setup environment of project
    cmds:
      - task: uv:environment
      - task: pre-commit:setup
      - task: git:setup
      - task: node:environment
      - task: ai:environment

  fix:
    desc: "Run fix on all files"
    cmds:
      - task: biome:fix

  validate:
    desc: "Run validate on all files"
    cmds:
      - task: module-hyprland:lint
      - task: module-nvim:lint
      - task: pre-commit:lint

  build:
    desc: "Build project artifacts"
    cmds:
      - task: nvim:build

  nix:build:
    desc: "Build Nix dev shell (install all tools)"
    cmds:
      - cmd: nix --extra-experimental-features "nix-command flakes" develop --command true
        ignore_error: true
    silent: true

  nix:develop:
    desc: "Enter Nix dev shell interactively"
    cmds:
      - cmd: nix --extra-experimental-features "nix-command flakes" develop --command zsh
        ignore_error: true
    interactive: true
    silent: true

  help:
    cmds:
      - cmd: |
          echo 'Use "task --list" to get a list of all available tasks with a short description of what they do.'
          echo 'There are some more tasks used as dependencies for other tasks.'
          echo 'You can view them with "task --list-all".'
        silent: true